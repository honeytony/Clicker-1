<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Кликер</h1>
    <hr>

    <h3>Сила клика: <span class="clickPower">1</span></h3>
    <h3>Кол-во очков: <span class="countPoints">0</span></h3>
    <h3>Сила автоклика: <span class="autopower">1</span></h3>
    <button class="button">
        Клик
    </button>


    <div class="upgrade-list">
        <button class="upgrade-button-1">Улучшение клика +1 (20 очков)</button>
        <button class="upgrade-button-2">Улучшение клика +100 (5000 очков)</button>
        <button class="upgrade-auto-button-1">Улучшение автоклика +1 (50 очков)</button>

    </div>

    <script src="app.js"></script>
</body>

</html>
